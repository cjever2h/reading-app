<body>
  <section id="auth-view" class="auth hidden">
    <div class="auth-card">
      <img src="icon-192.png" alt="" class="auth-logo" />
      <h1>독서앱</h1>
      <p class="muted">읽은 시간 · 남은 문장 · 독서노트 · AI각인 독서가이드</p>
      <form id="auth-form" class="form">
        <label>이메일<input type="email" id="auth-email" required autocomplete="email" /></label>
        <label>비밀번호<input type="password" id="auth-password" required minlength="6" autocomplete="current-password" /></label>
        <div class="row gap">
          <button type="submit" class="btn primary grow" data-mode="signin">로그인</button>
          <button type="submit" class="btn grow" data-mode="signup">회원가입</button>
        </div>
        <button type="button" class="link small" id="auth-reset">비밀번호를 잊었어요</button>
        <p id="auth-msg" class="error small"></p>
      </form>
      <p class="muted small">휴대폰과 데스크톱에서 같은 계정으로 로그인하면 같은 기록을 봐요.</p>
    </div>
  </section>
